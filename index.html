<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>User Form</title>

<style>
    body{
        font-family: Arial, sans-serif;
        margin:40px;
    }

    .form-box{
        width:350px;
        padding:20px;
        border:1px solid #ccc;
        border-radius:8px;
    }

    input{
        width:100%;
        padding:10px;
        margin-bottom:15px;
        box-sizing:border-box;
    }

    button{
        padding:10px 20px;
        cursor:pointer;
    }

    table{
        width:500px;
        border-collapse:collapse;
        margin-top:30px;
    }

    table,th,td{
        border:1px solid #000;
    }

    th,td{
        padding:10px;
        text-align:center;
    }

    th{
        background:#f2f2f2;
    }
</style>
</head>
<body>

<div class="form-box">

    <input type="text" id="userid" placeholder="Enter User ID">

    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="saveData()">Submit</button>

</div>

<table id="dataTable">
    <tr>
        <th>User ID</th>
        <th>Password</th>
        <th>Action</th>
    </tr>
</table>

<script>

function saveData(){

    // User ID Input ki value lena
    const user = document.getElementById("userid").value;

    // Password Input ki value lena
    const pass = document.getElementById("password").value;

    // Agar koi input empty ho to alert dikhao
    if(user === "" || pass === ""){
        alert("Please fill both fields.");
        return;
    }

    // Table ko select karna
    const table = document.getElementById("dataTable");

    // Table ke last me ek new row banana
    const row = table.insertRow();

    // Row ke andar 3 cells banana
    const cell1 = row.insertCell(0);
    const cell2 = row.insertCell(1);
    const cell3 = row.insertCell(2);
    const cell4 = row.insertCell(3);

    // User ID show karna
    cell1.innerHTML = user;

    // Password show karna
    cell2.innerHTML = pass;

    // Delete Icon (SVG)
    cell3.innerHTML = `
        <svg onclick="deleteRow(this)"
             xmlns="http://www.w3.org/2000/svg"
             width="22"
             height="22"
             viewBox="0 0 24 24"
             fill="red"
             style="cursor:pointer">

            <path d="M18 6L6 18M6 6l12 12"
                  stroke="red"
                  stroke-width="2"
                  stroke-linecap="round"/>
        </svg>
    `;

    // Input Fields ko empty kar dena
    document.getElementById("userid").value = "";
    document.getElementById("password").value = "";

}
</script>
