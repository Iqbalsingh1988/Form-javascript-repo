<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript User Form</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        .form-box {
            width: 350px;
            border: 1px solid #ccc;
            padding: 20px;
            border-radius: 8px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        table {
            width: 550px;
            border-collapse: collapse;
            margin-top: 30px;
        }

        table,
        th,
        td {
            border: 1px solid #000;
        }

        th,
        td {
            padding: 12px;
            text-align: center;
        }

        th {
            background: #f2f2f2;
        }

        svg {
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- =========================
         User Form
    ========================== -->

    <div class="form-box">

        <input type="text" id="userid" placeholder="Enter User ID">

        <input type="password" id="password" placeholder="Enter Password">

        <button onclick="saveData()">Submit</button>

    </div>


    <!-- =========================
         Table
    ========================== -->

    <table id="dataTable">

        <tr>
            <th>User ID</th>
            <th>Password</th>
            <th>Action</th>
        </tr>

    </table>


    <script>

        // ============================================
        // Submit Button Function
        // ============================================

        function saveData() {

            // User ID ki value lena
            const user = document.getElementById("userid").value;

            // Password ki value lena
            const pass = document.getElementById("password").value;


            // Agar koi field empty ho
            if (user == "" || pass == "") {

                alert("Please fill both fields.");

                return;
            }


            // Table ko select karna
            const table = document.getElementById("dataTable");


            // New Row banana
            const row = table.insertRow();


            // 3 Cells banana
            const cell1 = row.insertCell(0);
            const cell2 = row.insertCell(1);
            const cell3 = row.insertCell(2);


            // User ID show karna
            cell1.innerHTML = user;

            // Password show karna
            cell2.innerHTML = pass;


            // Delete SVG Add karna
            cell3.innerHTML = `
            
            <svg onclick="deleteRow(this)"
                 xmlns="http://www.w3.org/2000/svg"
                 width="22"
                 height="22"
                 viewBox="0 0 24 24">

                <path
                    d="M18 6L6 18M6 6L18 18"
                    stroke="red"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    fill="none"/>

            </svg>

            `;


            // Input Empty karna
            document.getElementById("userid").value = "";
            document.getElementById("password").value = "";

        }



        // ============================================
        // Delete Function
        // ============================================

        function deleteRow(icon) {

            // icon = jis SVG par click hua

            // SVG ke sabse nearest TR ko dhoondna
            const row = icon.closest("tr");

            // Row Delete kar dena
            row.remove();

        }


    </script>

</body>

</html>
